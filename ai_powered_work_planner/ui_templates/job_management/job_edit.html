{% extends 'base/base.html' %}
{% block content %}

<div class="form-container">

    <h2>Edit Job</h2>
    <p class="form-subtitle">Update job details</p>

    <form method="post">
        {% csrf_token %}

        <div class="form-group">
            <label>Job Name</label>
            {{ form.job_name }}
        </div>

        <div class="form-group">
            <label>Pay Rate (₹ per hour)</label>
            {{ form.pay_rate }}
        </div>

        <div class="form-group">
            <label>Location</label>
            {{ form.location }}
        </div>

        <button type="submit" class="btn-primary">Update Job</button>

        <a href="/jobs/" class="btn-secondary">Back</a>

    </form>

</div>

{% endblock %}
